<!DOCTYPE html>
<html dir="rtl" lang="ckb">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دروستکەری فۆڕم</title>
    <style>
        body { font-family: Tahoma, Arial, sans-serif; padding: 20px; background: #f0f2f5; }
        input, textarea { width: 100%; padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 8px; margin-bottom: 15px; box-sizing: border-box; }
        textarea { height: 300px; }
        button { width: 100%; padding: 15px; background: #673ab7; color: white; border: none; border-radius: 8px; font-size: 18px; cursor: pointer; font-weight: bold; }
        button:hover { background: #512da8; }
        #status { margin-top: 15px; font-weight: bold; text-align: center; }
        label { font-weight: bold; display: block; margin-bottom: 5px; }
    </style>
</head>
<body>

    <h2>دانانی پرسیارەکان لە فۆڕمی ئامادەکراو</h2>
    
    <label>لینکەکەی فۆڕم ئەپ لێرە دابنێ:</label>
    <input type="text" id="formUrl" placeholder="لینکەکە لێرە دابنێ..." dir="ltr">

    <label>پرسیارەکانت لێرە دابنێ:</label>
    <textarea id="quizData" placeholder="پرسیارەکان..."></textarea>
    
    <button onclick="sendToForm()">ناردن بۆ فۆڕمەکە</button>
    <div id="status"></div>

    <script>
        // !!! لێرەدا لینکە درێژەکەی گوگڵ سکریپت دابنێ !!!
        const GOOGLE_SCRIPT_URL = "لینکەکەی_گوگڵ_لێرە_دابنێ";

        function sendToForm() {
            let urlField = document.getElementById('formUrl').value.trim();
            let text = document.getElementById('quizData').value;
            
            if (!urlField) {
                alert("    https://script.google.com/macros/s/AKfycbwKRADM7xFrxM8LykIcK-NL1qaBLsa-xMmWhpGslmSBAM5mkW8ui-3aGl7LjA6khc8l/exec     ");
                return;
            }

            document.getElementById('status').innerText = "چاوەڕێ بە، خەریکی پڕکردنەوەیە...";
            
            text = text.replace(/[\u200B-\u200D\uFEFF]/g, '');
            let lines = text.split('\n').filter(line => line.trim() !== '');
            
            let data = { formUrl: urlField, questions: [] };
            let currentQuestion = null;

            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();
                
                if (line.match(/\[MCQ-(\d+)\]/i)) {
                    if (currentQuestion) data.questions.push(currentQuestion);
                    currentQuestion = { type: 'mcq', question: "", options: [] };
                }
                else if (currentQuestion) {
                    if (currentQuestion.question === "") {
                        currentQuestion.question = line;
                    } else {
                        let baseOption = line;
                        while (currentQuestion.options.includes(baseOption)) {
                            baseOption += ' '; 
                        }
                        currentQuestion.options.push(baseOption);
                    }
                }
            }
            if (currentQuestion) data.questions.push(currentQuestion);

            fetch(GOOGLE_SCRIPT_URL, {
                method: "POST",
                body: JSON.stringify(data)
            })
            .then(res => res.json())
            .then(result => {
                if (result.success) document.getElementById('status').innerText = "✅ نێردرا! دەتوانیت لە ئەپەکە بیکەیتەوە.";
                else document.getElementById('status').innerText = "❌ هەڵەیەک ڕوویدا: " + result.error;
            }).catch(err => document.getElementById('status').innerText = "❌ کێشەی هێڵ: " + err);
        }
    </script>
</body>
</html>
