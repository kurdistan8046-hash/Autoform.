<!DOCTYPE html>
<html dir="rtl" lang="ckb">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دروستکەری فۆڕم</title>
    <style>
        body { font-family: Tahoma, Arial, sans-serif; padding: 20px; background: #f0f2f5; }
        input, textarea { width: 100%; padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 8px; margin-bottom: 15px; box-sizing: border-box; }
        textarea { height: 300px; }
        button { width: 100%; padding: 15px; background: #1a73e8; color: white; border: none; border-radius: 8px; font-size: 18px; cursor: pointer; font-weight: bold; }
        button:hover { background: #1557b0; }
        #status { margin-top: 15px; font-weight: bold; text-align: center; }
        label { font-weight: bold; display: block; margin-bottom: 5px; }
    </style>
</head>
<body>
    <h2>بەرنامەی ئۆتۆماتیکی کویز</h2>
    
    <label>لینکی فۆڕمە بەتاڵەکە:</label>
    <input type="text" id="formUrl" placeholder="لینکی فۆڕمەکەی لێرە دابنێ..." dir="ltr">
    
    <label>پرسیارەکان:</label>
    <textarea id="quizData" placeholder="پرسیارەکانت لێرە دابنێ..."></textarea>
    
    <button onclick="sendToForm()">ناردن بۆ فۆڕمەکە</button>
    <div id="status"></div>

    <script>
        // تێبینی: ئەو لینکەی لە گوگڵ کۆپیت کرد لێرە دایبنێ لەناو جووتە کەوانەکەدا
        const GOOGLE_SCRIPT_URL = "    https://script.google.com/macros/s/AKfycbzq4QFg1xtjn-62nQR8W39939Ad6sCiD-E3l87Rn6qdyhPoEbyOPso4vClPW0AqS0TA/exec  ";

        function sendToForm() {
            let urlField = document.getElementById('formUrl').value.trim();
            if (!urlField) {
                alert("تکایە سەرەتا لینکی فۆڕمەکە دابنێ!");
                return;
            }

            document.getElementById('status').innerText = "چاوەڕێ بە، خەریکی پڕکردنەوەیە...";
            let text = document.getElementById('quizData').value;
            let lines = text.split('\n').filter(line => line.trim() !== '');
            
            let data = { formUrl: urlField, title: "", description: "", questions: [] };
            let currentQuestion = null;

            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();
                
                if (line.startsWith('TITLE:')) data.title = line.replace('TITLE:', '').trim();
                else if (line.startsWith('DESC:')) data.description = line.replace('DESC:', '').trim();
                else if (line.match(/^\[SHORT-(\d+)\]/i)) {
                    if (currentQuestion) data.questions.push(currentQuestion);
                    let points = parseInt(line.match(/^\[SHORT-(\d+)\]/i)[1]);
                    currentQuestion = { type: 'short', points: points, question: "", options: [] };
                }
                else if (line.match(/^\[MCQ-(\d+)\]/i)) {
                    if (currentQuestion) data.questions.push(currentQuestion);
                    let points = parseInt(line.match(/^\[MCQ-(\d+)\]/i)[1]);
                    currentQuestion = { type: 'mcq', points: points, question: "", options: [] };
                }
                else if (currentQuestion) {
                    if (currentQuestion.question === "") {
                        currentQuestion.question = line;
                    } else {
                        currentQuestion.options.push(line);
                    }
                }
            }
            if (currentQuestion) data.questions.push(currentQuestion);

            fetch(GOOGLE_SCRIPT_URL, {
                method: "POST",
                body: JSON.stringify(data)
            })
            .then(res => res.json())
            .then(result => {
                if (result.success) document.getElementById('status').innerText = "✅ فۆڕمەکە بە سەرکەوتوویی پڕکرایەوە!";
                else document.getElementById('status').innerText = "❌ هەڵەیەک ڕوویدا: " + result.error;
            }).catch(err => document.getElementById('status').innerText = "❌ کێشەی هێڵ: " + err);
        }
    </script>
</body>
</html>
